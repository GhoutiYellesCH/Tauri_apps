[package]
name = "tpm"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tpm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
tauri = { version = "2.5.2", features = [] }
tauri-plugin-opener = { version = "2.5.2" } # Assuming you want to keep this, though not in the original plan

# CRITICAL SECURITY & JSON DEPENDENCIES (Consolidated)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5"
rand = { version = "0.8", features = ["std", "getrandom"] }
zeroize = { version = "1.6", features = ["zeroize_derive"] }
base64 = { version = "0.21", features = ["std"] }
aes-gcm = "0.10"
uuid = { version = "1.7", features = ["v4"] }
